version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://backend.ryban.ru/api/v1
        - VITE_SOCKET_URL=https://backend.ryban.ru
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "2769:3000"